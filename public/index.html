
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>PriceScout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#0d1117; --card:#161b22; --card2:#21262d;
  --text:#e6edf3; --text2:#8b949e; --text3:#6e7681;
  --border:#30363d; --border2:#21262d;
  --blue:#4d9fff; --green:#3fb950; --red:#ff4d4d;
  --yellow:#ffcc00; --purple:#bc8cff;
  --profit:#3fb950; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);min-height:100vh;color:var(--text);}
body{font-family:'Inter',sans-serif;display:flex;justify-content:center;}
#app{width:100%;max-width:420px;padding-bottom:40px;}

/* Header */
.hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.logo-dots{display:flex;gap:5px;align-items:center;}
.logo-dots span{width:10px;height:10px;border-radius:50%;}
.logo-dots span:nth-child(1){background:#E53238;}
.logo-dots span:nth-child(2){background:#4d9fff;}
.logo-dots span:nth-child(3){background:#ffcc00;}
.logo-dots span:nth-child(4){background:#3fb950;}
.app-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.3px;}
.live-badge{margin-left:auto;font-size:10px;font-weight:600;padding:3px 8px;background:rgba(63,185,80,0.1);color:var(--green);border-radius:20px;border:1px solid rgba(63,185,80,0.3);letter-spacing:0.5px;}

/* Scan card */
.scan-wrap{margin:12px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
.vbox{width:100%;height:190px;background:#080b10;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.vbox::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(77,159,255,.1) 0%,transparent 65%);}
#video{width:100%;height:100%;object-fit:cover;display:none;}
#canvas-cap{display:none;}
.cam-idle{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;}
.cam-idle i{font-size:40px;color:rgba(255,255,255,.15);}
.cam-idle span{font-size:12px;color:rgba(255,255,255,.2);font-weight:500;}
#photo-prev{display:none;position:absolute;inset:0;z-index:2;}
#prev-img{width:100%;height:100%;object-fit:contain;background:#080b10;}

/* Mode buttons */
.mode-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px;}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:8px;border:1px solid var(--border);background:var(--card2);cursor:pointer;font-size:10px;font-weight:600;color:var(--text2);font-family:'Inter',sans-serif;transition:all .15s;letter-spacing:0.2px;}
.mbtn:hover{background:var(--card);color:var(--text);}
.mbtn.on{border-color:var(--blue);color:var(--blue);background:rgba(77,159,255,.08);}
.mbtn i{font-size:20px;}

/* Hidden inputs */
#barcode-reader-div{display:none;}

/* Search */
.search-row{display:flex;gap:6px;padding:0 10px 10px;}
.search-row input{flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s;}
.search-row input:focus{border-color:var(--blue);}
.search-row input::placeholder{color:var(--text3);}
.go-btn{padding:9px 16px;border-radius:8px;background:var(--blue);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:background .15s;}
.go-btn:hover{background:#2d87f0;}
.go-btn:active{background:#1a6fd4;}

/* Status */
.status{margin:0 12px 8px;padding:9px 12px;border-radius:8px;font-size:12px;font-weight:500;display:none;}
.status.info{background:rgba(77,159,255,.1);color:var(--blue);border:1px solid rgba(77,159,255,.2);display:block;}
.status.ok{background:rgba(63,185,80,.1);color:var(--green);border:1px solid rgba(63,185,80,.2);display:block;}
.status.load{background:var(--card2);color:var(--text2);border:1px solid var(--border);display:block;}
.status.err{background:rgba(255,77,77,.1);color:var(--red);border:1px solid rgba(255,77,77,.2);display:block;}

/* Results */
.results{padding:0 12px;display:none;}
.results.on{display:block;}

/* Product card */
.prod-card{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;}
.prod-thumb{width:56px;height:56px;border-radius:8px;flex-shrink:0;border:1px solid var(--border);object-fit:contain;background:#0d1117;}
.prod-thumb-ph{width:56px;height:56px;border-radius:8px;flex-shrink:0;border:1px solid var(--border);background:var(--card2);display:flex;align-items:center;justify-content:center;}
.prod-thumb-ph i{font-size:24px;color:var(--text3);}
.prod-name{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:3px;color:var(--text);}
.prod-meta{font-size:11px;color:var(--text2);}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;}
.stat-lbl{font-size:10px;color:var(--text2);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px;}
.stat-val{font-size:20px;font-weight:800;color:var(--text);}
.stat-val.g{color:var(--green);}
.stat-val.b{color:var(--blue);}
.stat-sub{font-size:10px;color:var(--text3);margin-top:2px;}

/* Price bar */
.price-range{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;}
.pr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.pr-label{font-size:12px;font-weight:600;color:var(--text);}
.pr-avg-tag{font-size:10px;font-weight:600;color:var(--red);background:rgba(255,77,77,.1);padding:2px 8px;border-radius:20px;border:1px solid rgba(255,77,77,.2);}
.pr-track{height:6px;background:var(--card2);border-radius:3px;position:relative;overflow:visible;margin-bottom:6px;}
.pr-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3fb950,#4d9fff);width:100%;position:relative;}
.pr-marker{position:absolute;top:-5px;width:3px;height:16px;background:var(--red);border-radius:2px;transform:translateX(-50%);}
.pr-ends{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);font-weight:500;}

/* Listings */
.sec-hd{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.listings-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px;}
.listing{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .1s;}
.listing:last-child{border-bottom:none;}
.listing:hover{background:var(--card2);}
.l-rank{font-size:10px;color:var(--text3);min-width:14px;text-align:center;font-weight:700;}
.l-img{width:32px;height:32px;border-radius:5px;object-fit:contain;border:1px solid var(--border);background:#0d1117;flex-shrink:0;}
.l-img-ph{width:32px;height:32px;border-radius:5px;background:var(--card2);border:1px solid var(--border);flex-shrink:0;}
.l-info{flex:1;min-width:0;}
.l-title{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;color:var(--text);font-weight:500;}
.l-date{font-size:10px;color:var(--text3);}
.l-cond{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--card2);color:var(--text2);white-space:nowrap;border:1px solid var(--border);font-weight:500;}
.l-price{font-size:13px;font-weight:800;color:var(--profit);}

/* eBay link */
.ebay-link{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:var(--radius);border:1px solid var(--border);color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;background:transparent;width:100%;font-family:'Inter',sans-serif;text-decoration:none;transition:all .15s;margin-bottom:4px;}
.ebay-link:hover{background:rgba(77,159,255,.08);border-color:var(--blue);}
.ebay-link i{font-size:14px;}
</style>
</head>
<body>
<div id="app">

  <header class="hdr">
    <div class="logo-dots">
      <span></span><span></span><span></span><span></span>
    </div>
    <span class="app-name">PriceScout</span>
    <span class="live-badge">LIVE</span>
  </header>

  <div class="scan-wrap">
    <div class="vbox">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas-cap"></canvas>
      <div class="cam-idle" id="cam-idle">
        <i class="ti ti-barcode" aria-hidden="true"></i>
        <span>Tap a button below to start</span>
      </div>
      <div id="photo-prev"><img id="prev-img" alt=""/></div>
    </div>

    <div class="mode-row">
      <button class="mbtn" id="bb" onclick="startBarcode()">
        <i class="ti ti-barcode" aria-hidden="true"></i>
        Scan barcode
      </button>
      <button class="mbtn" id="pb" onclick="startPhoto()">
        <i class="ti ti-camera" aria-hidden="true"></i>
        Take photo
      </button>
      <button class="mbtn" id="ub" onclick="triggerUpload()">
        <i class="ti ti-photo-up" aria-hidden="true"></i>
        Upload image
      </button>
    </div>

    <div id="barcode-reader-div"></div>
    <input type="file" id="inp-barcode" accept="image/*" capture="environment" style="display:none" onchange="handleBarcodeCapture(event)"/>
    <input type="file" id="inp-photo"   accept="image/*" capture="environment" style="display:none" onchange="handlePhotoCapture(event)"/>
    <input type="file" id="inp-upload"  accept="image/*"                       style="display:none" onchange="handleUpload(event)"/>

    <div class="search-row">
      <input type="text" id="q" placeholder="Product name or barcode number…"/>
      <button class="go-btn" onclick="doSearch()">Search</button>
    </div>
  </div>

  <div style="height:10px"></div>
  <div class="status" id="status"></div>

  <div class="results" id="results">
    <div class="prod-card" id="prod-card"></div>
    <div class="stats" id="stats"></div>
    <div class="price-range" id="price-range"></div>
    <div class="sec-hd">Recent sold listings</div>
    <div class="listings-wrap" id="listings"></div>
    <a class="ebay-link" id="ebay-link" href="#" target="_blank" rel="noopener">
      <i class="ti ti-external-link" aria-hidden="true"></i>
      View all sold listings on eBay
    </a>
  </div>

</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const API = 'https://compassionate-patience-production-4d82.up.railway.app';
const $ = id => document.getElementById(id);
const fx = (n,c) => (c==='USD'?'$':c==='EUR'?'€':'£') + Number(n).toFixed(2);

function setStatus(msg,type){const el=$('status');el.className='status '+type;el.textContent=msg;}
function clearStatus(){$('status').className='status';}
function timeAgo(str){if(!str)return'';const d=Math.floor((Date.now()-new Date(str))/86400000);return d===0?'Today':d===1?'Yesterday':d+' days ago';}
function showPreview(url){$('cam-idle').style.display='none';$('photo-prev').style.display='block';$('prev-img').src=url;}
function resetButtons(){['bb','pb','ub'].forEach(id=>$(id).classList.remove('on'));}

function startBarcode(){resetButtons();$('bb').classList.add('on');$('inp-barcode').click();}
function startPhoto(){resetButtons();$('pb').classList.add('on');$('inp-photo').click();}
function triggerUpload(){resetButtons();$('ub').classList.add('on');$('inp-upload').click();}

async function handleBarcodeCapture(e){
  const file=e.target.files[0];if(!file)return;e.target.value='';
  setStatus('Reading barcode…','load');
  try{
    const html5QrCode=new Html5Qrcode('barcode-reader-div');
    const result=await html5QrCode.scanFileV2(file,false);
    const code=result.decodedText;
    const fr=new FileReader();fr.onload=ev=>showPreview(ev.target.result);fr.readAsDataURL(file);
    $('q').value=code;setStatus('Barcode detected: '+code,'ok');
    await lookupBarcode(code);
  }catch(err){
    const fr=new FileReader();fr.onload=ev=>showPreview(ev.target.result);fr.readAsDataURL(file);
    setStatus('Barcode not read — type product name below and tap Search','info');
  }
}

function handlePhotoCapture(e){
  const file=e.target.files[0];if(!file)return;e.target.value='';
  const fr=new FileReader();fr.onload=ev=>{showPreview(ev.target.result);setStatus('Photo captured! Type product name below and tap Search','info');};fr.readAsDataURL(file);
}

function handleUpload(e){
  const file=e.target.files[0];if(!file)return;e.target.value='';
  const fr=new FileReader();fr.onload=ev=>{showPreview(ev.target.result);setStatus('Image loaded! Type product name below and tap Search','info');};fr.readAsDataURL(file);
}

async function lookupBarcode(code){
  setStatus('Looking up barcode…','load');
  try{
    const r=await fetch(`${API}/api/barcode/${encodeURIComponent(code)}`);
    const data=await r.json();const name=data.name||code;$('q').value=name;
    if(data.source!=='raw'){setStatus('Found: '+name,'ok');fetchSold(name,data.category||'General');}
    else{setStatus('Product not found — confirm name below and tap Search','info');}
  }catch(e){setStatus('Lookup failed — type product name manually','info');}
}

function doSearch(){
  const q=$('q').value.trim();if(!q){setStatus('Enter a product name or barcode','info');return;}
  setStatus('Searching eBay sold listings…','load');fetchSold(q,'General');
}

async function fetchSold(query,category){
  try{
    const r=await fetch(`${API}/api/ebay/sold?q=${encodeURIComponent(query)}&limit=20`);
    const data=await r.json();if(data.error)throw new Error(data.error);
    renderResults(data,query,category);
  }catch(e){setStatus('eBay lookup failed: '+e.message,'err');}
}

function renderResults(data,query,category){
  const{stats,listings,totalSold}=data;
  const cur=listings[0]?.currency||'GBP';
  const img=listings.find(l=>l.imageUrl)?.imageUrl||'';

  $('prod-card').innerHTML=`
    ${img?`<img class="prod-thumb" src="${img}" alt="product" onerror="this.style.display='none'">`:`<div class="prod-thumb-ph"><i class="ti ti-tag" aria-hidden="true"></i></div>`}
    <div><div class="prod-name">${query}</div><div class="prod-meta">${category} &middot; ${totalSold} sold in last 30 days</div></div>`;

  $('stats').innerHTML=`
    <div class="stat"><div class="stat-lbl">Avg sold price</div><div class="stat-val g">${fx(stats.avg,cur)}</div><div class="stat-sub">last 30 days</div></div>
    <div class="stat"><div class="stat-lbl">Units sold</div><div class="stat-val b">${totalSold}</div><div class="stat-sub">last 30 days</div></div>
    <div class="stat"><div class="stat-lbl">Lowest sold</div><div class="stat-val">${fx(stats.low,cur)}</div><div class="stat-sub">recent</div></div>
    <div class="stat"><div class="stat-lbl">Highest sold</div><div class="stat-val">${fx(stats.high,cur)}</div><div class="stat-sub">recent</div></div>`;

  const pct=stats.high>stats.low?((stats.avg-stats.low)/(stats.high-stats.low)*100).toFixed(1):50;
  $('price-range').innerHTML=`
    <div class="pr-top"><span class="pr-label">Price range</span><span class="pr-avg-tag">avg ${fx(stats.avg,cur)}</span></div>
    <div class="pr-track"><div class="pr-fill"><div class="pr-marker" style="left:${pct}%"></div></div></div>
    <div class="pr-ends"><span>${fx(stats.low,cur)}</span><span>${fx(stats.high,cur)}</span></div>`;

  $('listings').innerHTML=listings.slice(0,12).map((l,i)=>`
    <div class="listing" onclick="window.open('${l.url}','_blank')">
      <span class="l-rank">${i+1}</span>
      ${l.imageUrl?`<img class="l-img" src="${l.imageUrl}" alt="" onerror="this.style.display='none'">`:`<div class="l-img-ph"></div>`}
      <div class="l-info"><div class="l-title">${l.title}</div><div class="l-date">${timeAgo(l.soldDate)}${l.location?' &middot; '+l.location:''}</div></div>
      <span class="l-cond">${l.condition}</span>
      <span class="l-price">${fx(l.price,l.currency)}</span>
    </div>`).join('');

  $('ebay-link').href=`https://www.ebay.co.uk/sch/i.html?_nkw=${encodeURIComponent(query)}&LH_Sold=1&LH_Complete=1`;
  $('results').classList.add('on');clearStatus();
  $('results').scrollIntoView({behavior:'smooth',block:'start'});
}

$('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
</script>
</body>
</html>
